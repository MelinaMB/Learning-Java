<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Guía Java - De 0 a Experto</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="Guía completa de Java desde fundamentos hasta arquitectura avanzada">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  <style>
    :root {
      --theme-color: #4CAF50;
    }
    .sidebar-toggle {
      background-color: #4CAF50;
    }
    .app-nav a:hover,
    .sidebar-nav li.active > a {
      color: #4CAF50;
    }
    .markdown-section code {
      color: #2e7d32;
    }
    .tip {
      border-left: 4px solid #4CAF50;
      padding: 10px 15px;
      background: #f1f8e9;
      margin: 1em 0;
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <script>
    window.$docsify = {
      name: '☕ Guía Java',
      repo: '',
      loadSidebar: true,
      loadNavbar: false,
      loadCoverpage: true,
      coverpage: '_coverpage.md',
      onlyCover: false,
      autoHeader: true,
      auto2top: true,
      homepage: 'README.md',
      themeColor: '#4CAF50',
      maxLevel: 4,
      subMaxLevel: 3,
      search: {
        maxAge: 86400000,
        paths: 'auto',
        placeholder: 'Buscar en la guía...',
        noData: 'No se encontraron resultados',
        depth: 4,
        hideOtherSidebarContent: false,
      },
      plugins: [],
    }
  </script>
  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-java.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-bash.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-xml-doc.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-copy-code/dist/docsify-copy-code.min.js"></script>
</body>
</html>
